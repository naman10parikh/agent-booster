<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">agent-booster --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Agent Booster — Zero-LLM Code Transforms</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Usage:</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">  agent-booster &lt;transform&gt; &lt;file-or-dir&gt;</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">  agent-booster &lt;transform&gt; --stdin</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  agent-booster list</text>
<text x="24" y="206" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">Transforms:</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">  var-to-const       Convert var/let to const where safe</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  remove-console     Strip console.log/warn/error statements</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  add-logging        Inject debug logging at function entries</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  add-error-handling Wrap async functions in try/catch</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  format-imports     Sort and group import statements</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  add-strict         Add 'use strict' directive</text>
<text x="24" y="366" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  route &lt;file&gt;           Classify edits → run mechanical ones for $0, escalate the rest to an LLM</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                         (--only=t1,t2 limits it to the transforms you name)</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  memory-search &quot;&lt;q&gt;&quot;    BM25 search over this repo's brain (MEMORY.md, memory/, brain/, docs/)</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">  sandbox-run &lt;t&gt; &lt;f&gt;    Run transform &lt;t&gt; over file &lt;f&gt; inside an isolated E2B sandbox</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  log [N]                Show the last N runs from the observability trail (logs/runs.jsonl)</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  list                   List available transforms</text>
<text x="24" y="526" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">  --dry-run          Show changes without writing</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
</svg>
